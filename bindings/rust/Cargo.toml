[package]
name = "tree-sitter-nim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nim grammar for tree-sitter"
repository = "https://github.com/metacraft-labs/tree-sitter-nim"
keywords = ["tree-sitter", "nim", "parser"]
categories = ["parsing", "text-editors"]
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"
tree-sitter = "0.25"

[build-dependencies]
cc = "1.0"
