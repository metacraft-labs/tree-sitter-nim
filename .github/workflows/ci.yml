name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run generate

      - run: npm test

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install && npm run generate

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release
        working-directory: bindings/rust

  test-nim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install && npm run generate

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"

      - name: Install tree-sitter library
        run: |
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter.git
          cd tree-sitter
          make
          sudo make install
          sudo ldconfig

      - name: Run byte-fidelity tests
        run: nimble testBytes -y

      # Note: Nim parity tests require additional setup and may have
      # expected failures as the canonicalization is refined.
      # Uncomment when ready:
      # - name: Run Nim parity tests
      #   run: nimble testNim -y
